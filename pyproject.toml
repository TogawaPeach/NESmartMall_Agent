[project]
name = "nesmartmall-agent"
version = "0.1.0"
description = "经纬智选商城 Agent 客服 Python 服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1,<2",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1,<2",
    "langchain-openai>=1.7.2,<2",
    "langchain-text-splitters>=1.1.3,<2",
    "nacos-sdk-python>=2,<3",
    "pydantic-settings>=2.6,<3",
    "pymilvus>=2.6,<2.7",
    "python-dotenv>=1,<2",
    "redis>=8.1.0,<9",
    "uplink[aiohttp]>=0.10,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
cache_dir = "../NESmartMall_Require/pythonrequire/.runtime/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.fastapi]
entrypoint = "app.main:app"
